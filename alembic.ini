[alembic]
# Path to the migration scripts directory
script_location = migrations

# Version path separator used by Alembic
version_path_separator = os

# SQLAlchemy url to the database
# This can be set via environment variable WHATSTHEDAMAGE_DATABASE_URI
# Default is sqlite:///app.db
sqlalchemy.url = sqlite:///app.db

# Additional SQLAlchemy configuration options
# These are passed to SQLAlchemy's create_engine()
# Note: pool_size and max_overflow are not supported for SQLite
# sqlalchemy.pool_size = 5
# sqlalchemy.max_overflow = 10
sqlalchemy.pool_pre_ping = True

# Alembic-specific configuration
# Time format for migration timestamps
timestamp_format = %%Y-%%m-%%d %%H:%%M:%%S

# Enable autogenerate for migrations
alembic.generate_skip = 

[post_write_hooks]
# Hooks to run after writing migration files

[loggers]
# Configure logging for Alembic
keys = root,sqlalchemy,alembic

[handlers]
# Logging handlers
keys = console

[formatters]
# Logging formatters
keys = generic

[logger_root]
# Root logger configuration
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
# SQLAlchemy logger configuration
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
# Alembic logger configuration
level = INFO
handlers = console
qualname = alembic

[handler_console]
# Console handler configuration
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
# Logging formatter
format = %%(asctime)s [%%(levelname)s] %%(name)s: %%(message)s
datefmt = %%Y-%%m-%%d %%H:%%M:%%S
